<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Contact Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24" class="logo-icon">
            <path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.34 5L2 22l5.25-1.38c1.42.79 3.05 1.25 4.75 1.25 5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18.2c-1.52 0-2.98-.41-4.25-1.15l-.3-.18-3.12.82.83-3.04-.2-.32C4.19 15.05 3.8 13.56 3.8 12c0-4.52 3.68-8.2 8.2-8.2 4.52 0 8.2 3.68 8.2 8.2 0 4.52-3.68 8.2-8.2 8.2z"/>
          </svg>
        </div>
        <div class="title-group">
          <h1>WA Exporter Pro</h1>
          <div class="status-badge" id="status-indicator">
            <span class="status-dot dot-offline"></span>
            <span id="status-text">Checking WhatsApp Web...</span>
          </div>
        </div>
      </div>
      <button class="btn-icon" id="btn-refresh" title="Refresh Contacts">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>

    <!-- Not connected banner -->
    <div class="banner-notice hidden" id="banner-not-connected">
      <p>Please open or refresh <a href="https://web.whatsapp.com" target="_blank">web.whatsapp.com</a> to start exporting.</p>
    </div>

    <!-- Quick Stats Cards -->
    <div class="stats-row">
      <div class="stat-card" data-tab="all">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-title">Total Contacts</span>
      </div>
      <div class="stat-card" data-tab="unsaved">
        <span class="stat-num text-accent" id="stat-unsaved">0</span>
        <span class="stat-title">Unsaved Numbers</span>
      </div>
      <div class="stat-card" data-tab="groups">
        <span class="stat-num" id="stat-groups">0</span>
        <span class="stat-title">Groups</span>
      </div>
    </div>

    <!-- Tabs Navigation -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="all">All Contacts</button>
      <button class="tab-btn" data-tab="unsaved">Unsaved Numbers</button>
      <button class="tab-btn" data-tab="groups">Group Chats</button>
      <button class="tab-btn" data-tab="labels">Labels</button>
    </nav>

    <!-- Controls & Search Bar -->
    <div class="controls-bar">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" class="search-icon"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Search by name, number, group...">
      </div>
      <div class="selection-actions">
        <label class="select-all-label">
          <input type="checkbox" id="chk-select-all" checked>
          <span id="selection-summary">All selected</span>
        </label>
      </div>
    </div>

    <!-- Main List Preview Container -->
    <main class="list-container" id="list-container">
      <div class="loading-state" id="loading-spinner">
        <div class="spinner"></div>
        <p>Loading WhatsApp data...</p>
      </div>
      <div class="items-list hidden" id="items-list">
        <!-- Rendered items go here -->
      </div>
      <div class="empty-state hidden" id="empty-state">
        <p>No matching contacts found.</p>
      </div>
    </main>

    <!-- Export Action Bar -->
    <footer class="export-footer">
      <div class="export-options">
        <span class="export-label">Export Format:</span>
        <div class="format-buttons">
          <button class="btn-format" data-format="csv" title="Export as CSV (Excel compatible)">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            CSV
          </button>
          <button class="btn-format" data-format="xlsx" title="Export as Excel Workbook">
            <svg viewBox="0 0 24 24"><path d="M21.17 3.25Q21.5 3.25 21.76 3.5 22 3.74 22 4.08V19.92Q22 20.26 21.76 20.5 21.5 20.75 21.17 20.75H7.83Q7.5 20.75 7.24 20.5 7 20.26 7 19.92V17H2.83Q2.5 17 2.24 16.76 2 16.5 2 16.17V7.83Q2 7.5 2.24 7.24 2.5 7 2.83 7H7V4.08Q7 3.74 7.24 3.5 7.5 3.25 7.83 3.25M7 15H3.5V9H7M15.5 17.5V14.5H12V17.5M15.5 13V10.5H12V13M15.5 9.5V6.5H12V9.5M20.5 17.5V14.5H17V17.5M20.5 13V10.5H17V13M20.5 9.5V6.5H17V9.5Z"/></svg>
            Excel
          </button>
          <button class="btn-format" data-format="vcf" title="Export as vCard for Phone Import">
            <svg viewBox="0 0 24 24"><path d="M20 0H4v2h16V0zM4 24h16v-2H4v2zM20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 2.75c1.24 0 2.25 1.01 2.25 2.25s-1.01 2.25-2.25 2.25S9.75 10.24 9.75 9 10.76 6.75 12 6.75zM17 17H7v-1.5c0-1.67 3.33-2.5 5-2.5s5 .83 5 2.5V17z"/></svg>
            vCard (.vcf)
          </button>
          <button class="btn-format" data-format="json" title="Export as structured JSON">
            <svg viewBox="0 0 24 24"><path d="M5 3h2v2H5v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5h2v2H5c-1.1 0-2-.9-2-2v-4a2 2 0 0 0-2-2v-2a2 2 0 0 0 2-2V5c0-1.1.9-2 2-2zm14 0c1.1 0 2 .9 2 2v4a2 2 0 0 0 2 2v2a2 2 0 0 0-2 2v4c0 1.1-.9 2-2 2h-2v-2h2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5h-2V3h2z"/></svg>
            JSON
          </button>
        </div>
      </div>
    </footer>
  </div>

  <script src="../lib/exporters.js"></script>
  <script src="popup.js"></script>
</body>
</html>
